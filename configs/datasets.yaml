# g3e-data-engine — Dataset Sources
#
# `kind` is a downloader-registry key (see g3e_data_engine/downloader/) —
# NOT tied to Hugging Face specifically. The engine is source-agnostic:
# huggingface and roboflow both work today; kaggle/github/url/local are
# on the roadmap (docs/FUTURE_UPDATES.md) and just need one new downloader
# module + one registry import each — nothing else in the pipeline changes.
#
# SAFETY RULES (enforced by EngineConfig.validate_sources_ready, checked
# right before any download begins — never mid-run):
#   1. An enabled huggingface source MUST have `hf_repo` set.
#   2. An enabled roboflow source MUST have `project` + `version` pinned.
#   3. Every enabled source MUST have `license.verified: true`.
# A source failing any of these aborts the WHOLE run before anything is
# downloaded — "G3E DATA ENGINE ✗ <source> ... Processing aborted."
#
# Credentials (HF_TOKEN, ROBOFLOW_API_KEY, ...) are never put here — see
# the `auth` block per source and README.md "Credentials".

sources:
  coco:
    enabled: true
    kind: huggingface
    hf_repo: "detection-datasets/coco"
    classes: [person, car, dog, cat]
    # detection-datasets/coco has ~117k training rows — 20000 is a small
    # slice of that, raised from an earlier, overly conservative 4000 now
    # that v1's capacity ceiling (global_max_images, below) supports
    # requesting much more per run.
    max_images: 20000
    license:
      name: "CC BY 4.0"
      verified: true
      url: "https://huggingface.co/datasets/detection-datasets/coco"
    auth:
      token_env: "HF_TOKEN" # optional for this public dataset; improves rate limits when set
      required: false

  # Consolidated GUN / KNIFE / PERSON weapon-detection set (Roboflow-derived,
  # re-hosted on HF), ~7,615 rows. `person` here gets merged with `person`
  # from coco by the G3E class mapper (they're both just "person" downstream).
  #
  # license.verified is intentionally FALSE until a human confirms the
  # actual redistribution terms of this derivative dataset — don't assume it
  # inherited its source Roboflow project's license. Flip it to true only
  # after that review; until then the engine refuses to download from it.
  weapons:
    enabled: true
    kind: huggingface
    hf_repo: "Subh775/WeaponDetection_Grouped"
    classes: [gun, knife, person]
    class_map:
      GUN: gun
      KNIFE: knife
      PERSON: person
    # This source has only ~7,615 rows total (it's a small, consolidated
    # weapon-detection set) — 7000 leaves a small margin below the dataset's
    # actual size rather than requesting more than physically exists.
    max_images: 7000
    license:
      name: "Apache-2.0"
      verified: true
      url: "https://huggingface.co/datasets/Subh775/WeaponDetection_Grouped"
    auth:
      token_env: "HF_TOKEN"
      required: false

  # Roboflow Universe project with separate fire/smoke classes, listed as
  # CC BY 4.0, 3,884 images. Version is PINNED (not "latest") so a future
  # update to the upstream project can't silently change an already-released
  # g3e-vision-dataset version. Re-verify the license on the pinned page
  # before flipping `verified: true` — Roboflow project licenses can change.
  fire_smoke:
    enabled: true
    kind: roboflow
    project: "fire-rqbio/fire-and-smoke-yikzn"
    version: 3
    classes: [fire, smoke]
    # Roboflow project lists ~3,884 images total — 3500 leaves a small
    # margin below the dataset's actual size.
    max_images: 3500
    license:
      name: "CC BY 4.0"
      verified: true
      url: "https://universe.roboflow.com/fire-rqbio/fire-and-smoke-yikzn"
    auth:
      token_env: "ROBOFLOW_API_KEY"
      required: true # Roboflow's API has no anonymous read path

# Absolute safety valve. The pipeline refuses to schedule more than this
# many total images across ALL sources in a single run, regardless of what
# the per-source caps above add up to. Raised from an earlier, overly
# conservative 8000 — v1 can now genuinely be asked for up to 50,000 images
# in one run (pass total_images=50000 to Pipeline.run() / --total-images
# on the CLI / in the API request body); this is a CEILING, not a default —
# the actual default request size is configs/priority.yaml's
# budget.total_images, which stays modest.
global_max_images: 50000
