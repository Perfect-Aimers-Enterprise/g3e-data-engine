# g3e-data-engine — Processing thresholds
image:
  # Checked against min(width, height) — the SHORTER side — not width and
  # height independently. A "min_width: 640, min_height: 640"-style check
  # requires BOTH dimensions to clear 640, which only near-square images
  # satisfy; it silently rejected the large majority of completely normal
  # 640x480 / 480x640 photos (COCO's most common shape). 416 accepts
  # typical photos at any aspect ratio while still filtering out thumbnails
  # and small crops. Raise it if you specifically need larger source images
  # (e.g. training at a higher target resolution).
  min_shorter_side: 416
  blur_threshold: 90        # Laplacian variance below this => rejected as blurry
  max_brightness: 250
  min_brightness: 35

duplicates:
  enabled: true
  method: phash              # perceptual hash
  hamming_distance_threshold: 5

labels:
  remove_empty: false        # keep background/negative images with no boxes

split:
  train: 0.8
  val: 0.1
  test: 0.1
  seed: 42
