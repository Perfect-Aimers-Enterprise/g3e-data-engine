[project]
name = "g3e-data-engine"
version = "0.1.0"
description = "Reusable, configuration-driven dataset engine for the G3E vision pipeline (download -> validate -> convert -> filter -> dedup -> metadata -> split -> stats -> export)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Godsave Ogbidor Kawurem" }]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pillow>=10.2",
    "imagehash>=4.3",
    "numpy>=1.26",
    "datasets>=2.18",       # HuggingFace `datasets` for source downloading
    "huggingface_hub>=0.22",
    "requests>=2.31",
    "tqdm>=4.66",
    "python-dotenv>=1.0",   # optional .env loading for HF_TOKEN / ROBOFLOW_API_KEY / etc
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
roboflow = ["roboflow>=1.1"]

[project.scripts]
g3e-pipeline = "scripts.run_pipeline:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["g3e_data_engine*"]
